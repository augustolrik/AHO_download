name: Publish student files

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Hent projektet
        uses: actions/checkout@v4

      - name: Sæt GitHub Pages op
        uses: actions/configure-pages@v5

      - name: Opdater fillisten
        run: node .site/scripts/generate-index.mjs

      - name: Pak den statiske side
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site-dist

      - name: Udgiv til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
